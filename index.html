<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>景点分级 · 从夯到拉完了</title>
<style>
  :root{
    --paper:#F6F4F0;
    --card:#FFFFFF;
    --ink:#1A1816;
    --muted:#6E675F;
    --line:#E3DED6;
    --line-strong:#CFC7BB;
    --accent:#D7263D;

    --t-hang:#D7263D;
    --t-top:#E8762A;
    --t-ren:#C9A227;
    --t-npc:#7C8795;
    --t-la:#4F5C77;

    --gap:clamp(14px,2vw,22px);
    --radius:12px;
    --shadow:0 1px 2px rgba(26,24,22,.05), 0 6px 18px -12px rgba(26,24,22,.22);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#131211;
      --card:#1C1B19;
      --ink:#F1EDE7;
      --muted:#9A938A;
      --line:#2B2927;
      --line-strong:#3A3734;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -14px rgba(0,0,0,.8);
    }
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:clamp(28px,5vw,64px) clamp(16px,4vw,32px) 80px}

  /* ---------- header ---------- */
  header{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:28px}
  .eyebrow{
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);margin:0 0 10px;font-weight:600;
  }
  h1{
    margin:0;font-size:clamp(28px,5.2vw,44px);line-height:1.15;
    font-weight:800;letter-spacing:-.01em;
  }
  h1 .sep{color:var(--line-strong);font-weight:400;margin:0 .18em}
  .lede{margin:12px 0 0;color:var(--muted);font-size:15px;max-width:52ch}

  .bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px}
  .count{font-size:14px;color:var(--muted);margin-right:auto}
  .count b{color:var(--ink);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}

  input[type=search],input[type=text],select,textarea{
    font:inherit;color:inherit;background:var(--card);
    border:1px solid var(--line-strong);border-radius:8px;padding:8px 11px;
  }
  input[type=search]{width:min(220px,46vw)}
  textarea{resize:vertical;min-height:64px;line-height:1.5}
  ::placeholder{color:var(--muted);opacity:.8}

  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line-strong);
    background:var(--card);color:var(--ink);padding:8px 14px;transition:background .12s,border-color .12s}
  button:hover{border-color:var(--ink)}
  .btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
  .btn-primary:hover{opacity:.88}
  .btn-ghost{background:transparent;border-style:dashed;color:var(--muted)}
  .btn-danger{color:var(--accent);border-color:transparent;background:transparent;padding:6px 8px}
  .btn-danger:hover{border-color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- tiers ---------- */
  .tier{
    display:grid;grid-template-columns:132px 1fr;gap:var(--gap);
    align-items:stretch;padding:var(--gap) 0;border-bottom:1px solid var(--line);
  }
  .tier:last-of-type{border-bottom:0}
  .tier-label{
    border-radius:var(--radius);color:#fff;padding:16px 14px;
    display:flex;flex-direction:column;justify-content:space-between;min-height:104px;
  }
  .tier-name{font-size:clamp(22px,2.6vw,30px);font-weight:800;line-height:1.1;letter-spacing:.02em}
  .tier-note{font-size:12px;opacity:.82;margin-top:6px;line-height:1.45}
  .tier-n{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums;align-self:flex-end}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:12px;align-content:start}

  .card{
    background:var(--card);border:1px solid var(--line);border-left:3px solid var(--tc,var(--line-strong));
    border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:3px;position:relative;
  }
  .card h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.005em;padding-right:22px}
  .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
  .meta span{display:inline-flex;align-items:center;gap:4px}
  .note{font-size:13.5px;color:var(--ink);opacity:.86;margin-top:5px}
  .card-actions{position:absolute;top:8px;right:8px;display:flex;gap:2px;opacity:0;transition:opacity .12s}
  .card:hover .card-actions,.card:focus-within .card-actions{opacity:1}
  .icon-btn{border:0;background:transparent;padding:3px 5px;line-height:1;color:var(--muted);font-size:13px;border-radius:6px}
  .icon-btn:hover{background:var(--paper);color:var(--ink)}

  .empty{
    grid-column:1/-1;
    border:1px dashed var(--line-strong);border-radius:var(--radius);
    color:var(--muted);font-size:13.5px;padding:16px;display:flex;align-items:center;
    justify-content:center;min-height:72px;
  }

  /* ---------- dialog ---------- */
  dialog{
    border:1px solid var(--line-strong);border-radius:14px;background:var(--card);color:var(--ink);
    padding:0;width:min(440px,92vw);box-shadow:0 24px 60px -20px rgba(0,0,0,.4);
  }
  dialog::backdrop{background:rgba(26,24,22,.45);backdrop-filter:blur(2px)}
  .dlg-head{padding:18px 20px 0}
  .dlg-head h2{margin:0;font-size:19px;font-weight:700}
  form.dlg{padding:14px 20px 18px;display:grid;gap:12px}
  .field{display:grid;gap:5px}
  .field label{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
  .tier-pick{display:flex;flex-wrap:wrap;gap:6px}
  .tier-pick input{position:absolute;opacity:0;width:0;height:0}
  .tier-pick label{
    font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line-strong);color:var(--muted);user-select:none;
  }
  .tier-pick input:checked + label{background:var(--tc);border-color:var(--tc);color:#fff}
  .tier-pick input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
  .dlg-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}

  footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);
    display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  footer .hint{font-size:12.5px;color:var(--muted);margin-right:auto;max-width:46ch}
  .warn{font-size:12.5px;color:var(--accent);margin:10px 0 0}

  @media (max-width:640px){
    .tier{grid-template-columns:1fr;gap:10px}
    .tier-label{flex-direction:row;align-items:center;min-height:0;padding:11px 14px}
    .tier-note{display:none}
    .tier-n{margin-left:auto;align-self:center}
    .cards{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">Scenic Spot Tier List</p>
    <h1>夯<span class="sep">→</span>拉完了</h1>
    <p class="lede">我去过的所有景点，五档分级。好的进夯，烂的进拉完了，中间的自己掂量。</p>
    <div class="bar">
      <p class="count">已收录 <b id="total">0</b> 个景点</p>
      <input type="search" id="filter" placeholder="搜景点 / 地点" aria-label="搜索景点">
      <button class="btn-primary" id="add-btn">+ 添加景点</button>
    </div>
    <p class="warn" id="storage-warn" hidden>浏览器本地存储不可用（常见于直接打开本地文件），本次改动不会被保存——用下方「导出 JSON」留存数据。</p>
  </header>

  <main id="tiers"></main>

  <footer>
    <p class="hint">数据存在你这台设备的浏览器里，不上传。换设备或清缓存前记得导出。</p>
    <button id="export-btn">导出 JSON</button>
    <button id="import-btn">导入 JSON</button>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
  </footer>
</div>

<dialog id="dlg">
  <div class="dlg-head"><h2 id="dlg-title">添加景点</h2></div>
  <form method="dialog" class="dlg" id="form">
    <div class="field">
      <label for="f-name">景点名称</label>
      <input type="text" id="f-name" name="name" required maxlength="40" placeholder="黄岩石窟">
    </div>
    <div class="field">
      <label for="f-place">所在地</label>
      <input type="text" id="f-place" name="place" maxlength="40" placeholder="浙江 台州">
    </div>
    <div class="field">
      <label for="f-date">去的时间</label>
      <input type="text" id="f-date" name="date" maxlength="20" placeholder="2025-09 或留空">
    </div>
    <div class="field">
      <label id="tier-legend">评级</label>
      <div class="tier-pick" role="radiogroup" aria-labelledby="tier-legend" id="tier-pick"></div>
    </div>
    <div class="field">
      <label for="f-note">一句话评价</label>
      <textarea id="f-note" name="note" maxlength="140" placeholder="选填"></textarea>
    </div>
    <div class="dlg-foot">
      <button type="button" id="cancel-btn">取消</button>
      <button type="submit" class="btn-primary" id="save-btn">保存</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  "use strict";

  /* ---- 五档，从高到低。改这里就能改档位文案 ---- */
  var TIERS = [
    { key:"hang",  name:"夯",     note:"值得专程飞一趟", color:"var(--t-hang)" },
    { key:"top",   name:"顶级",   note:"路过必须进去",   color:"var(--t-top)"  },
    { key:"ren",   name:"人上人", note:"去了不亏",       color:"var(--t-ren)"  },
    { key:"npc",   name:"npc",    note:"有它没它一样",   color:"var(--t-npc)"  },
    { key:"la",    name:"拉完了", note:"劝退",           color:"var(--t-la)"   }
  ];

  /* ---- 初始数据 ---- */
  var SEED = [
    { id:"seed-huangyan", name:"黄岩石窟", place:"浙江 台州", date:"", tier:"top", note:"" }
  ];

  var KEY = "scenic-tiers-v1";
  var store = { ok:true };
  var spots = load();
  var editingId = null;

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(Array.isArray(parsed)) return parsed;
      }
    }catch(e){
      store.ok = false;
      document.getElementById("storage-warn").hidden = false;
    }
    return SEED.slice();
  }

  function save(){
    if(!store.ok) return;
    try{
      localStorage.setItem(KEY, JSON.stringify(spots));
    }catch(e){
      store.ok = false;
      document.getElementById("storage-warn").hidden = false;
    }
  }

  function isTier(key){
    for(var i=0;i<TIERS.length;i++) if(TIERS[i].key===key) return true;
    return false;
  }

  function uid(){
    return "s-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7);
  }

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---- 渲染 ---- */
  var tiersEl = document.getElementById("tiers");
  var filterEl = document.getElementById("filter");

  function render(){
    var q = filterEl.value.trim().toLowerCase();
    var visible = spots.filter(function(s){
      if(!q) return true;
      return (s.name + " " + (s.place||"") + " " + (s.note||"")).toLowerCase().indexOf(q) > -1;
    });

    tiersEl.innerHTML = TIERS.map(function(t){
      var items = visible.filter(function(s){ return s.tier === t.key; });
      var all = spots.filter(function(s){ return s.tier === t.key; }).length;

      var cards = items.length
        ? items.map(function(s){
            var meta = [];
            if(s.place) meta.push("<span>" + esc(s.place) + "</span>");
            if(s.date)  meta.push("<span>" + esc(s.date) + "</span>");
            return '<article class="card" style="--tc:' + t.color + '">' +
              '<div class="card-actions">' +
                '<button class="icon-btn" data-edit="' + s.id + '" aria-label="编辑 ' + esc(s.name) + '">改</button>' +
                '<button class="icon-btn" data-del="' + s.id + '" aria-label="删除 ' + esc(s.name) + '">删</button>' +
              '</div>' +
              '<h3>' + esc(s.name) + '</h3>' +
              (meta.length ? '<p class="meta">' + meta.join("") + '</p>' : '') +
              (s.note ? '<p class="note">' + esc(s.note) + '</p>' : '') +
            '</article>';
          }).join("")
        : '<div class="empty">' + (q ? "没有匹配的景点" : "这一档还空着") + '</div>';

      return '<section class="tier" aria-labelledby="t-' + t.key + '">' +
        '<div class="tier-label" style="background:' + t.color + '">' +
          '<div>' +
            '<div class="tier-name" id="t-' + t.key + '">' + esc(t.name) + '</div>' +
            '<div class="tier-note">' + esc(t.note) + '</div>' +
          '</div>' +
          '<div class="tier-n">' + all + '</div>' +
        '</div>' +
        '<div class="cards">' + cards + '</div>' +
      '</section>';
    }).join("");

    document.getElementById("total").textContent = spots.length;
  }

  /* ---- 弹窗 ---- */
  var dlg = document.getElementById("dlg");
  var form = document.getElementById("form");
  var pick = document.getElementById("tier-pick");
  // 注意：form.name 会被 HTMLFormElement 自身的 name 属性遮蔽，这里按 id 直接取
  var fName  = document.getElementById("f-name");
  var fPlace = document.getElementById("f-place");
  var fDate  = document.getElementById("f-date");
  var fNote  = document.getElementById("f-note");

  pick.innerHTML = TIERS.map(function(t,i){
    return '<span style="--tc:' + t.color + ';position:relative">' +
      '<input type="radio" name="tier" id="tier-' + t.key + '" value="' + t.key + '"' + (i===1?" checked":"") + '>' +
      '<label for="tier-' + t.key + '">' + esc(t.name) + '</label>' +
    '</span>';
  }).join("");

  function openDialog(spot){
    editingId = spot ? spot.id : null;
    document.getElementById("dlg-title").textContent = spot ? "编辑景点" : "添加景点";
    fName.value  = spot ? spot.name : "";
    fPlace.value = spot ? (spot.place||"") : "";
    fDate.value  = spot ? (spot.date||"")  : "";
    fNote.value  = spot ? (spot.note||"")  : "";
    var key = spot ? spot.tier : "top";
    var radio = form.querySelector('input[name=tier][value="' + key + '"]');
    if(radio) radio.checked = true;
    dlg.showModal();
    fName.focus();
  }

  form.addEventListener("submit", function(){
    var data = {
      name: fName.value.trim(),
      place: fPlace.value.trim(),
      date: fDate.value.trim(),
      note: fNote.value.trim(),
      tier: (form.querySelector("input[name=tier]:checked")||{}).value || "npc"
    };
    if(!data.name) return;

    if(editingId){
      spots = spots.map(function(s){
        return s.id === editingId ? Object.assign({}, s, data) : s;
      });
    }else{
      data.id = uid();
      spots.push(data);
    }
    editingId = null;
    save();
    render();
  });

  document.getElementById("cancel-btn").addEventListener("click", function(){
    editingId = null;
    dlg.close();
  });

  document.getElementById("add-btn").addEventListener("click", function(){ openDialog(null); });

  tiersEl.addEventListener("click", function(e){
    var ed = e.target.closest("[data-edit]");
    if(ed){
      var spot = spots.filter(function(s){ return s.id === ed.getAttribute("data-edit"); })[0];
      if(spot) openDialog(spot);
      return;
    }
    var del = e.target.closest("[data-del]");
    if(del){
      var id = del.getAttribute("data-del");
      var target = spots.filter(function(s){ return s.id === id; })[0];
      if(target && confirm("删除「" + target.name + "」？")){
        spots = spots.filter(function(s){ return s.id !== id; });
        save();
        render();
      }
    }
  });

  filterEl.addEventListener("input", render);

  /* ---- 导入导出 ---- */
  document.getElementById("export-btn").addEventListener("click", function(){
    var blob = new Blob([JSON.stringify(spots, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "景点分级.json";
    a.click();
    URL.revokeObjectURL(url);
  });

  var importFile = document.getElementById("import-file");
  document.getElementById("import-btn").addEventListener("click", function(){ importFile.click(); });
  importFile.addEventListener("change", function(){
    var file = importFile.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(!Array.isArray(data)) throw new Error("格式不对");
        spots = data.map(function(s){
          return {
            id: s.id || uid(),
            name: String(s.name || "未命名"),
            place: String(s.place || ""),
            date: String(s.date || ""),
            note: String(s.note || ""),
            tier: isTier(s.tier) ? s.tier : "npc"
          };
        });
        save();
        render();
      }catch(err){
        alert("导入失败：" + err.message);
      }
      importFile.value = "";
    };
    reader.readAsText(file);
  });

  render();
})();
</script>
</body>
</html>
