<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>去过的地方</title>
<meta name="description" content="我去过的景点，五档分级：夯、顶级、人上人、npc、拉完了。">
<meta name="theme-color" content="#FAF9F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0C0D" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  :root{
    color-scheme:light dark;

    --bg:#FAF9F7;
    --surface:#FFFFFF;
    --surface-2:#F3F2EF;
    --line:#E7E4DE;
    --line-soft:#EFEDE8;

    --ink:#16161A;
    --ink-2:#56555C;
    --ink-3:#6F6E78;

    --accent:#4F46E5;
    --accent-weak:rgba(79,70,229,.1);
    --accent-on:#FFFFFF;
    --danger:#C0392B;

    --shadow-sm:0 1px 2px rgba(22,22,26,.05);
    --shadow-md:0 1px 3px rgba(22,22,26,.06),0 8px 24px -10px rgba(22,22,26,.16);
    --shadow-lg:0 1px 2px rgba(22,22,26,.08),0 28px 56px -18px rgba(22,22,26,.3);

    --r-sm:8px; --r-md:12px; --r-lg:18px;

    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
           "Microsoft YaHei",system-ui,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0C0C0D;
      --surface:#141417;
      --surface-2:#1C1C20;
      --line:#26262B;
      --line-soft:#1E1E22;

      --ink:#F4F4F5;
      --ink-2:#A6A6AE;
      --ink-3:#8A8A95;

      --accent:#8B82FF;
      --accent-weak:rgba(139,130,255,.16);
      --accent-on:#0C0C0D;
      --danger:#FF7A6B;

      --shadow-sm:none;
      --shadow-md:0 0 0 1px var(--line);
      --shadow-lg:0 0 0 1px var(--line),0 28px 56px -18px rgba(0,0,0,.8);
    }
  }

  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.55;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  }
  .page{max-width:860px;margin:0 auto;padding:clamp(36px,6vw,76px) clamp(18px,4vw,28px) 120px}
  button,input{font:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  /* ---------- 头部 ---------- */
  .hero{margin-bottom:clamp(28px,4vw,40px)}
  h1{margin:0;font-size:clamp(32px,5.6vw,46px);line-height:1.08;
     font-weight:700;letter-spacing:-.038em}
  .counts{margin:12px 0 0;display:flex;align-items:baseline;gap:8px;
          font-size:14px;color:var(--ink-2)}
  .counts b{font-size:20px;font-weight:700;color:var(--ink);
            font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .counts .sep{color:var(--line);font-size:16px}

  /* 国旗墙 —— 同时就是国家筛选器 */
  .wall{display:flex;flex-wrap:wrap;gap:14px;margin-top:24px}
  .pin{
    position:relative;cursor:pointer;background:none;border:0;padding:0;
    width:40px;height:40px;border-radius:50%;
    transition:transform .14s cubic-bezier(.2,.8,.3,1),opacity .14s;
  }
  .pin .flag{width:40px;height:40px;border-radius:50%;display:block;
             box-shadow:0 0 0 1px rgba(22,22,26,.1) inset}
  .pin .num{
    position:absolute;right:-4px;bottom:-4px;min-width:17px;height:17px;
    padding:0 4px;border-radius:9px;background:var(--surface);color:var(--ink-2);
    border:1px solid var(--line);font-size:10px;font-weight:600;line-height:15px;
    font-variant-numeric:tabular-nums;
  }
  .pin:hover{transform:translateY(-2px)}
  .wall[data-filtering="1"] .pin{opacity:.34}
  .wall[data-filtering="1"] .pin[aria-pressed="true"]{opacity:1}
  .pin[aria-pressed="true"] .flag{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
  .pin.all{
    display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);
    font-size:11px;font-weight:600;color:var(--ink-2);letter-spacing:-.02em;
  }
  .pin.all[aria-pressed="true"]{border-color:transparent;box-shadow:0 0 0 2px var(--accent);color:var(--accent)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- 工具条 ---------- */
  .bar{display:flex;gap:8px;align-items:center;margin-top:26px}
  input[type=search],input[type=text]{
    color:var(--ink);background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:9px 13px;font-size:14px;
    transition:border-color .12s,box-shadow .12s;box-shadow:var(--shadow-sm);
  }
  input[type=search]{flex:1;min-width:0;max-width:320px}
  input:hover{border-color:var(--ink-3)}
  input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
  ::placeholder{color:var(--ink-3)}

  .btn{
    cursor:pointer;border-radius:var(--r-sm);font-size:14px;font-weight:600;
    padding:10px 17px;border:1px solid transparent;transition:opacity .12s,border-color .12s,color .12s;
    white-space:nowrap;
  }
  .btn.primary{background:var(--accent);color:var(--accent-on);box-shadow:var(--shadow-sm)}
  .btn.primary:hover{opacity:.88}
  .btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line);font-weight:500}
  .btn.ghost:hover{border-color:var(--ink-3);color:var(--ink)}

  /* ---------- 档位 ---------- */
  .tier{margin-top:clamp(26px,3.4vw,38px)}
  .tier-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .tier-head h2{margin:0;font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
  .tier-head .blurb{margin-left:auto;font-size:12.5px;color:var(--ink-3)}

  /* 排名用这枚徽章的填充深浅表达，不是五种颜色 */
  .badge{
    font-size:12px;font-weight:650;line-height:1;padding:5px 9px;border-radius:999px;
    font-variant-numeric:tabular-nums;
  }
  .b1{background:var(--ink);color:var(--bg)}
  .b2{background:color-mix(in srgb,var(--ink) 62%,transparent);color:var(--bg)}
  .b3{background:color-mix(in srgb,var(--ink) 30%,transparent);color:var(--ink)}
  .b4{background:var(--surface-2);color:var(--ink-2)}
  .b5{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}

  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden;
  }
  .rows{list-style:none;margin:0;padding:6px;
        display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:2px}
  .rows>li{min-width:0}
  .row{
    width:100%;text-align:left;cursor:pointer;background:transparent;border:0;
    border-radius:var(--r-md);display:flex;align-items:center;gap:12px;
    padding:9px 11px;transition:background .12s;
  }
  .row:hover{background:var(--surface-2)}
  .flag{width:28px;height:28px;border-radius:50%;flex:none;display:block;
        box-shadow:0 0 0 1px rgba(22,22,26,.1) inset;background:var(--surface-2)}
  .ph{display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-3)}
  .nm{font-size:15.5px;font-weight:550;letter-spacing:-.011em;color:var(--ink);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .cy{margin-left:auto;font-size:12.5px;color:var(--ink-3);white-space:nowrap;flex:none}
  .none{grid-column:1/-1;padding:14px 12px;font-size:13.5px;color:var(--ink-3);margin:0}

  /* ---------- 页脚 ---------- */
  footer{margin-top:clamp(40px,5vw,60px);padding-top:22px;border-top:1px solid var(--line);
         display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  footer .hint{font-size:12.5px;color:var(--ink-3);margin-right:auto;max-width:46ch;line-height:1.6}
  .warn{font-size:12.5px;color:var(--danger);margin:14px 0 0}

  /* ---------- 弹窗 ---------- */
  dialog{
    border:0;border-radius:var(--r-lg);background:var(--surface);color:var(--ink);padding:0;
    width:min(400px,92vw);box-shadow:var(--shadow-lg);
  }
  dialog::backdrop{background:rgba(12,12,13,.4);backdrop-filter:blur(3px)}
  .dlg-head{display:flex;align-items:center;gap:11px;padding:20px 22px 0}
  .dlg-head .t{font-size:17px;font-weight:650;letter-spacing:-.015em}
  form{padding:18px 22px 20px;display:grid;gap:14px}
  .field{display:grid;gap:6px}
  .field label{font-size:12.5px;color:var(--ink-2);font-weight:550}
  .field input{width:100%}

  .picker{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
  .picker span{position:relative;display:block}
  .picker input{position:absolute;opacity:0;width:0;height:0}
  .picker label{
    display:block;text-align:center;font-size:12.5px;line-height:1.35;cursor:pointer;
    padding:9px 2px;border:1px solid var(--line);border-radius:var(--r-sm);color:var(--ink-2);
    user-select:none;transition:border-color .12s,color .12s,background .12s;
  }
  .picker label:hover{border-color:var(--ink-3)}
  .picker input:checked + label{
    background:var(--accent);border-color:var(--accent);color:var(--accent-on);font-weight:650;
  }
  .picker input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}

  .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
  .acts .kill{margin-right:auto;color:var(--danger);border-color:transparent}
  .acts .kill:hover{border-color:var(--danger);color:var(--danger)}

  @media (max-width:620px){
    .rows{grid-template-columns:1fr}
    .tier-head .blurb{display:none}
    .pin,.pin .flag{width:36px;height:36px}
    .picker{grid-template-columns:repeat(3,1fr)}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page">

  <header class="hero">
    <h1>去过的地方</h1>
    <p class="counts">
      <b id="n-spots">0</b> 处 <span class="sep">/</span>
      <b id="n-countries">0</b> 个国家
    </p>
    <div class="wall" id="wall" role="group" aria-label="按国家筛选"></div>
    <div class="bar">
      <input type="search" id="find" placeholder="搜景点或国家" aria-label="搜索">
      <button class="btn primary" id="add">添加</button>
    </div>
    <p class="warn" id="warn" hidden>这个浏览器不让本地文件存数据，改动不会留下。用本地服务打开，或先导出备份。</p>
  </header>

  <main id="list"></main>

  <footer>
    <p class="hint">记录存在这台设备的浏览器里，不上传。换设备或清缓存前记得导出。</p>
    <button class="btn ghost" id="out">导出</button>
    <button class="btn ghost" id="in">导入</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </footer>
</div>

<dialog id="dlg">
  <div class="dlg-head">
    <img class="flag" id="dlg-flag" alt="" width="28" height="28">
    <span class="t" id="dlg-title">添加景点</span>
  </div>
  <form method="dialog" id="form">
    <div class="field">
      <label for="f-name">名称</label>
      <input type="text" id="f-name" required maxlength="48" placeholder="黄岩石窟" autocomplete="off">
    </div>
    <div class="field">
      <label for="f-country">国家</label>
      <input type="text" id="f-country" maxlength="24" placeholder="中国" list="countries" autocomplete="off">
      <datalist id="countries"></datalist>
    </div>
    <div class="field">
      <label id="pick-label">评级</label>
      <div class="picker" role="radiogroup" aria-labelledby="pick-label" id="picker"></div>
    </div>
    <div class="acts">
      <button type="button" class="btn ghost kill" id="kill" hidden>删除</button>
      <button type="button" class="btn ghost" id="cancel">取消</button>
      <button type="submit" class="btn primary" id="save">保存</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  "use strict";

  var TIERS = [
    { key:"hang", name:"夯",     blurb:"值得专程飞一趟", b:"b1" },
    { key:"top",  name:"顶级",   blurb:"路过必须进去",   b:"b2" },
    { key:"ren",  name:"人上人", blurb:"去了不亏",       b:"b3" },
    { key:"npc",  name:"npc",    blurb:"有它没它一样",   b:"b4" },
    { key:"la",   name:"拉完了", blurb:"劝退",           b:"b5" }
  ];

  /* 国家名 → ISO 两位码，用来取圆形国旗。认不出来的退回首字占位圆。 */
  var ISO = {
    "中国":"cn","中国大陆":"cn","香港":"hk","中国香港":"hk","澳门":"mo","中国澳门":"mo",
    "台湾":"tw","中国台湾":"tw","日本":"jp","韩国":"kr","南韩":"kr","朝鲜":"kp",
    "蒙古":"mn","泰国":"th","越南":"vn","柬埔寨":"kh","老挝":"la","缅甸":"mm",
    "马来西亚":"my","新加坡":"sg","印度尼西亚":"id","印尼":"id","菲律宾":"ph","文莱":"bn",
    "印度":"in","尼泊尔":"np","不丹":"bt","斯里兰卡":"lk","马尔代夫":"mv","巴基斯坦":"pk",
    "孟加拉国":"bd","哈萨克斯坦":"kz","乌兹别克斯坦":"uz","吉尔吉斯斯坦":"kg",
    "阿联酋":"ae","阿拉伯联合酋长国":"ae","沙特阿拉伯":"sa","卡塔尔":"qa","阿曼":"om",
    "以色列":"il","约旦":"jo","土耳其":"tr","伊朗":"ir","格鲁吉亚":"ge","亚美尼亚":"am",
    "阿塞拜疆":"az","俄罗斯":"ru","乌克兰":"ua",
    "英国":"gb","爱尔兰":"ie","法国":"fr","德国":"de","意大利":"it","西班牙":"es",
    "葡萄牙":"pt","荷兰":"nl","比利时":"be","卢森堡":"lu","瑞士":"ch","奥地利":"at",
    "捷克":"cz","斯洛伐克":"sk","波兰":"pl","匈牙利":"hu","罗马尼亚":"ro","保加利亚":"bg",
    "希腊":"gr","克罗地亚":"hr","斯洛文尼亚":"si","塞尔维亚":"rs","黑山":"me","阿尔巴尼亚":"al",
    "瑞典":"se","挪威":"no","芬兰":"fi","丹麦":"dk","冰岛":"is","爱沙尼亚":"ee",
    "拉脱维亚":"lv","立陶宛":"lt","马耳他":"mt","塞浦路斯":"cy","摩纳哥":"mc","梵蒂冈":"va",
    "美国":"us","加拿大":"ca","墨西哥":"mx","古巴":"cu","巴哈马":"bs","牙买加":"jm",
    "哥斯达黎加":"cr","巴拿马":"pa","巴西":"br","阿根廷":"ar","智利":"cl","秘鲁":"pe",
    "哥伦比亚":"co","厄瓜多尔":"ec","玻利维亚":"bo","乌拉圭":"uy",
    "埃及":"eg","摩洛哥":"ma","突尼斯":"tn","南非":"za","肯尼亚":"ke","坦桑尼亚":"tz",
    "埃塞俄比亚":"et","纳米比亚":"na","博茨瓦纳":"bw","毛里求斯":"mu","塞舌尔":"sc",
    "澳大利亚":"au","澳洲":"au","新西兰":"nz","斐济":"fj","巴布亚新几内亚":"pg"
  };
  var FLAG_BASE = "https://cdn.jsdelivr.net/gh/HatScripts/circle-flags@gh-pages/flags/";

  var SEED = [
    { id:"seed-huangyan", name:"黄岩石窟", country:"中国", tier:"top" }
  ];

  var KEY = "scenic-tiers-v1";
  var store = { ok:true };
  var spots = load();
  var editingId = null;
  var pick = "";                /* 当前国家筛选，空 = 全部 */

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var p = JSON.parse(raw);
        if(Array.isArray(p)) return p.map(migrate);
      }
    }catch(e){
      store.ok = false;
      document.getElementById("warn").hidden = false;
    }
    return SEED.slice();
  }

  /* 老版本有 place/where（地点）、date/when（时间）、note/said（一句话），已全部取消，读进来即丢弃。
     老记录没有国家，但凡有过地点的一律按中国处理，不对的点开改一下。 */
  function migrate(s){
    var hadPlace = !!(s.where || s.place);
    return {
      id: s.id || uid(),
      name: String(s.name || "未命名"),
      country: String(s.country || (hadPlace ? "中国" : "")),
      tier: isTier(s.tier) ? s.tier : "npc"
    };
  }

  function save(){
    if(!store.ok) return;
    try{ localStorage.setItem(KEY, JSON.stringify(spots)); }
    catch(e){
      store.ok = false;
      document.getElementById("warn").hidden = false;
    }
  }

  function isTier(k){
    for(var i=0;i<TIERS.length;i++) if(TIERS[i].key===k) return true;
    return false;
  }
  function uid(){
    return "s-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7);
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function iso(name){
    var k = String(name||"").trim();
    return ISO[k] || ISO[k.replace(/[　\s]/g,"")] || "";
  }

  /* 认得出国家就上圆形国旗，认不出就用首字占位圆，两者同尺寸同位置 */
  function flagHtml(cn, cls){
    var code = iso(cn);
    var label = cn || "未填";
    if(code){
      return '<img class="' + cls + '" src="' + FLAG_BASE + code + '.svg"' +
             ' alt="" width="28" height="28" loading="lazy" decoding="async"' +
             ' onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),' +
             '{className:\'' + cls + ' ph\',textContent:' + JSON.stringify(label.slice(0,1)) + '}))">';
    }
    return '<span class="' + cls + ' ph">' + esc(label.slice(0,1)) + '</span>';
  }

  function countries(){
    var seen = {}, out = [];
    spots.forEach(function(s){
      var c = s.country || "未填";
      if(!seen[c]){ seen[c] = 0; out.push(c); }
      seen[c]++;
    });
    out.sort(function(a,b){ return seen[b]-seen[a] || a.localeCompare(b,"zh"); });
    return out.map(function(c){ return { name:c, n:seen[c] }; });
  }

  /* ---------- 渲染 ---------- */
  var list = document.getElementById("list");
  var find = document.getElementById("find");
  var wall = document.getElementById("wall");

  function visible(){
    var q = find.value.trim().toLowerCase();
    return spots.filter(function(s){
      if(pick && (s.country || "未填") !== pick) return false;
      if(!q) return true;
      return (s.name + " " + s.country).toLowerCase().indexOf(q) > -1;
    });
  }

  function render(){
    var shown = visible();
    var filtering = !!pick || !!find.value.trim();

    list.innerHTML = TIERS.map(function(t){
      var mine = shown.filter(function(s){ return s.tier === t.key; });
      var rows = mine.length
        ? mine.map(function(s){
            return '<li><button type="button" class="row" data-open="' + s.id + '"' +
              ' aria-label="' + esc(s.name + "，" + (s.country||"未填") + "，" + t.name + "，打开详情") + '">' +
              flagHtml(s.country, "flag") +
              '<span class="nm">' + esc(s.name) + '</span>' +
              '<span class="cy">' + esc(s.country || "—") + '</span>' +
            '</button></li>';
          }).join("")
        : '<li class="none">' + (filtering ? "没有匹配的" : "还没有") + '</li>';

      return '<section class="tier">' +
        '<div class="tier-head">' +
          '<h2>' + esc(t.name) + '</h2>' +
          '<span class="badge ' + t.b + '">' + mine.length + '</span>' +
          '<span class="blurb">' + esc(t.blurb) + '</span>' +
        '</div>' +
        '<div class="card"><ul class="rows">' + rows + '</ul></div>' +
      '</section>';
    }).join("");

    var cs = countries();
    wall.setAttribute("data-filtering", pick ? "1" : "0");
    wall.innerHTML =
      '<button class="pin all" data-country="" aria-pressed="' + (!pick) + '"' +
        ' title="全部">全部<span class="sr">，共 ' + spots.length + ' 处</span></button>' +
      cs.map(function(c){
        return '<button class="pin" data-country="' + esc(c.name) + '"' +
          ' aria-pressed="' + (pick === c.name) + '" title="' + esc(c.name) + '">' +
          flagHtml(c.name, "flag") +
          '<span class="num">' + c.n + '</span>' +
          '<span class="sr">' + esc(c.name) + '，' + c.n + ' 处</span>' +
        '</button>';
      }).join("");

    document.getElementById("n-spots").textContent = spots.length;
    document.getElementById("n-countries").textContent =
      cs.filter(function(c){ return c.name !== "未填"; }).length;

    document.getElementById("countries").innerHTML =
      Object.keys(ISO).map(function(c){ return '<option value="' + esc(c) + '">'; }).join("");
  }

  /* ---------- 弹窗 ---------- */
  var dlg  = document.getElementById("dlg");
  var form = document.getElementById("form");
  // form.name 会被 HTMLFormElement 自身的 name 属性遮蔽，一律按 id 取
  var fName    = document.getElementById("f-name");
  var fCountry = document.getElementById("f-country");
  var killBtn  = document.getElementById("kill");
  var dlgFlag  = document.getElementById("dlg-flag");

  document.getElementById("picker").innerHTML = TIERS.map(function(t,i){
    return '<span>' +
      '<input type="radio" name="tier" id="p-' + t.key + '" value="' + t.key + '"' + (i===1?" checked":"") + '>' +
      '<label for="p-' + t.key + '">' + esc(t.name) + '</label>' +
    '</span>';
  }).join("");

  function syncDlgFlag(){
    var code = iso(fCountry.value);
    dlgFlag.style.display = code ? "block" : "none";
    if(code) dlgFlag.src = FLAG_BASE + code + ".svg";
  }
  fCountry.addEventListener("input", syncDlgFlag);

  function open(spot){
    editingId = spot ? spot.id : null;
    document.getElementById("dlg-title").textContent = spot ? spot.name : "添加景点";
    fName.value    = spot ? spot.name    : "";
    fCountry.value = spot ? spot.country : "";
    var r = form.querySelector('input[name=tier][value="' + (spot ? spot.tier : "top") + '"]');
    if(r) r.checked = true;
    killBtn.hidden = !spot;
    syncDlgFlag();
    dlg.showModal();
    fName.focus();
  }

  form.addEventListener("submit", function(){
    var data = {
      name:    fName.value.trim(),
      country: fCountry.value.trim(),
      tier:    (form.querySelector("input[name=tier]:checked")||{}).value || "npc"
    };
    if(!data.name) return;
    if(editingId){
      spots = spots.map(function(s){
        return s.id === editingId ? Object.assign({}, s, data) : s;
      });
    }else{
      data.id = uid();
      spots.push(data);
    }
    editingId = null;
    dropStaleFilter();
    save();
    render();
  });

  /* 筛选中的国家可能因为这次编辑/删除而不存在了，顺手清掉，免得页面空白 */
  function dropStaleFilter(){
    if(pick && !spots.some(function(s){ return (s.country||"未填") === pick; })) pick = "";
  }

  killBtn.addEventListener("click", function(){
    var gone = spots.filter(function(s){ return s.id === editingId; })[0];
    if(!gone || !confirm("删除「" + gone.name + "」？")) return;
    spots = spots.filter(function(s){ return s.id !== editingId; });
    editingId = null;
    dropStaleFilter();
    save();
    render();
    dlg.close();
  });

  document.getElementById("cancel").addEventListener("click", function(){
    editingId = null;
    dlg.close();
  });
  document.getElementById("add").addEventListener("click", function(){ open(null); });

  list.addEventListener("click", function(e){
    var row = e.target.closest("[data-open]");
    if(!row) return;
    var hit = spots.filter(function(s){ return s.id === row.getAttribute("data-open"); })[0];
    if(hit) open(hit);
  });

  wall.addEventListener("click", function(e){
    var p = e.target.closest("[data-country]");
    if(!p) return;
    var c = p.getAttribute("data-country");
    pick = (c && c === pick) ? "" : c;     /* 再点一次取消筛选 */
    render();
  });

  find.addEventListener("input", render);

  /* ---------- 导入导出 ---------- */
  document.getElementById("out").addEventListener("click", function(){
    var blob = new Blob([JSON.stringify(spots, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "去过的地方.json"; a.click();
    URL.revokeObjectURL(url);
  });

  var file = document.getElementById("file");
  document.getElementById("in").addEventListener("click", function(){ file.click(); });
  file.addEventListener("change", function(){
    var f = file.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(!Array.isArray(data)) throw new Error("这个文件不是备份");
        spots = data.map(migrate);
        pick = "";
        save();
        render();
      }catch(err){ alert("读不进来：" + err.message); }
      file.value = "";
    };
    reader.readAsText(f);
  });

  render();
})();
</script>
</body>
</html>
