<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>去过的地方</title>
<meta name="description" content="我去过的景点，五档分级：夯、顶级、人上人、npc、拉完了。">
<meta name="theme-color" content="#F8F8F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E0E" media="(prefers-color-scheme: dark)">
<style>
  :root{
    color-scheme:light dark;

    --bg:#F8F8F6;
    --raise:#FFFFFF;
    --line:#E2E2DE;
    --line-soft:#EDEDE9;
    --hover:#F0F0EC;

    --ink:#111111;
    --ink-2:#5A5A58;
    --ink-3:#6E6E6C;

    /* 排名不靠颜色，靠字号和墨色。每一级都算过对比度。 */
    --r1:#000000;
    --r2:#1A1A1A;
    --r3:#3D3D3D;
    --r4:#5F5F5F;
    --r5:#8A8A8A;

    --accent:#1D2FD8;
    --accent-weak:rgba(29,47,216,.09);
    --accent-on:#FFFFFF;
    --danger:#C0392B;

    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
           "Microsoft YaHei",system-ui,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0E0E0E;
      --raise:#161616;
      --line:#2A2A2A;
      --line-soft:#1E1E1E;
      --hover:#1A1A1A;

      --ink:#F2F2F2;
      --ink-2:#A8A8A6;
      --ink-3:#8E8E8C;

      --r1:#FFFFFF;
      --r2:#E8E8E8;
      --r3:#BDBDBD;
      --r4:#949494;
      --r5:#6E6E6E;

      --accent:#8A96FF;
      --accent-weak:rgba(138,150,255,.14);
      --accent-on:#0E0E0E;
      --danger:#FF7A6B;
    }
  }

  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  }
  .page{max-width:820px;margin:0 auto;padding:clamp(40px,7vw,88px) clamp(20px,5vw,32px) 120px}

  /* ---------- 页头 ---------- */
  .masthead{margin-bottom:clamp(32px,5vw,52px)}
  .title-row{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap}
  h1{margin:0;font-size:clamp(30px,5.4vw,44px);line-height:1.1;
     font-weight:700;letter-spacing:-.035em}
  .stats{margin:0 0 0 auto;font-size:13px;color:var(--ink-2);white-space:nowrap}
  .stats b{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}

  .controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:24px}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-right:auto}
  .chip{
    font:inherit;font-size:13px;line-height:1;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--ink-2);
    border-radius:999px;padding:7px 13px;white-space:nowrap;
    transition:border-color .12s,color .12s,background .12s;
  }
  .chip:hover{border-color:var(--ink-3);color:var(--ink)}
  .chip[aria-pressed="true"]{
    background:var(--accent-weak);border-color:transparent;color:var(--accent);font-weight:600;
  }
  .chip .c{font-variant-numeric:tabular-nums;opacity:.7;margin-left:5px}

  .tools{display:flex;gap:8px}
  input[type=search],input[type=text]{
    font:inherit;font-size:14px;color:var(--ink);background:var(--raise);
    border:1px solid var(--line);border-radius:8px;padding:8px 12px;width:150px;
    transition:border-color .12s;
  }
  input:hover{border-color:var(--ink-3)}
  ::placeholder{color:var(--ink-3)}

  button.go{
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;
    background:var(--accent);color:var(--accent-on);border:0;border-radius:8px;
    padding:9px 18px;transition:opacity .12s;
  }
  button.go:hover{opacity:.85}
  button.plain{
    font:inherit;font-size:14px;cursor:pointer;
    background:transparent;color:var(--ink-2);border:1px solid var(--line);
    border-radius:8px;padding:8px 14px;transition:border-color .12s,color .12s;
  }
  button.plain:hover{border-color:var(--ink-3);color:var(--ink)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- 档位 ---------- */
  .tier{margin-bottom:clamp(26px,3.6vw,40px)}
  .tier-head{display:flex;align-items:baseline;gap:14px;padding-bottom:10px}
  .tier-head h2{margin:0;line-height:1;letter-spacing:-.04em}
  .tier-head .n{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .tier-head .blurb{margin-left:auto;font-size:12.5px;color:var(--ink-3)}

  /* 排名 = 字号 + 墨色，往下逐级泄气 */
  .t1 h2{font-size:clamp(34px,5.6vw,54px);font-weight:700;color:var(--r1)}
  .t2 h2{font-size:clamp(29px,4.7vw,45px);font-weight:700;color:var(--r2)}
  .t3 h2{font-size:clamp(25px,4vw,38px);font-weight:600;color:var(--r3)}
  .t4 h2{font-size:clamp(22px,3.4vw,32px);font-weight:600;color:var(--r4)}
  .t5 h2{font-size:clamp(20px,3vw,27px);font-weight:500;color:var(--r5)}

  /* 只有名称和国家两列，所以条目走双栏流式，不横跨整页 */
  .rows{
    list-style:none;margin:0;padding:0;
    border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    column-gap:36px;
  }
  .row{
    font:inherit;text-align:left;cursor:pointer;width:100%;
    background:transparent;border:0;border-bottom:1px solid var(--line-soft);
    display:flex;align-items:baseline;gap:14px;
    padding:12px 8px;transition:background .1s;
  }
  .row:hover{background:var(--hover)}
  .nm{font-size:17px;font-weight:500;color:var(--ink);letter-spacing:-.01em;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cy{margin-left:auto;font-size:13px;color:var(--ink-3);white-space:nowrap}
  .none{grid-column:1/-1;padding:12px 8px;font-size:13.5px;color:var(--ink-3);
        border-bottom:1px solid var(--line-soft);margin:0}

  /* ---------- 页脚 ---------- */
  footer{margin-top:clamp(40px,6vw,64px);padding-top:20px;border-top:1px solid var(--line);
    display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  footer .hint{font-size:12.5px;color:var(--ink-3);margin-right:auto;max-width:44ch;line-height:1.6}
  .warn{font-size:12.5px;color:var(--accent);margin:14px 0 0}

  /* ---------- 弹窗 ---------- */
  dialog{
    border:0;border-radius:14px;background:var(--raise);color:var(--ink);padding:0;
    width:min(380px,92vw);box-shadow:0 1px 2px rgba(0,0,0,.08),0 24px 48px -16px rgba(0,0,0,.28);
  }
  dialog::backdrop{background:rgba(0,0,0,.34)}
  @media (prefers-color-scheme:dark){
    dialog{box-shadow:0 0 0 1px var(--line),0 24px 48px -16px rgba(0,0,0,.7)}
    dialog::backdrop{background:rgba(0,0,0,.6)}
  }
  .dlg-head{padding:20px 22px 0;font-size:17px;font-weight:600;letter-spacing:-.01em}
  form{padding:16px 22px 20px;display:grid;gap:14px}
  .field{display:grid;gap:6px}
  .field label{font-size:12.5px;color:var(--ink-2);font-weight:500}
  .field input{width:100%}

  .picker{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
  .picker span{position:relative;display:block}
  .picker input{position:absolute;opacity:0;width:0;height:0}
  .picker label{
    display:block;text-align:center;font-size:12.5px;line-height:1.35;cursor:pointer;
    padding:9px 2px;border:1px solid var(--line);border-radius:7px;color:var(--ink-2);
    user-select:none;transition:border-color .12s,color .12s,background .12s;
  }
  .picker label:hover{border-color:var(--ink-3)}
  .picker input:checked + label{
    background:var(--accent);border-color:var(--accent);color:var(--accent-on);font-weight:600;
  }
  .picker input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}

  .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
  .acts .kill{margin-right:auto;color:var(--danger);border-color:transparent}
  .acts .kill:hover{border-color:var(--danger);color:var(--danger)}

  @media (max-width:620px){
    .rows{grid-template-columns:1fr;column-gap:0}
    .tier-head .blurb{display:none}
    .tools{width:100%}
    input[type=search]{flex:1;width:auto}
    .picker{grid-template-columns:repeat(3,1fr)}
  }
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <div class="title-row">
      <h1>去过的地方</h1>
      <p class="stats"><b id="n-spots">0</b> 处 · <b id="n-countries">0</b> 个国家</p>
    </div>
    <div class="controls">
      <div class="chips" id="chips"></div>
      <div class="tools">
        <input type="search" id="find" placeholder="搜景点" aria-label="搜索景点">
        <button class="go" id="add">添加</button>
      </div>
    </div>
    <p class="warn" id="warn" hidden>这个浏览器不让本地文件存数据，改动不会留下。用本地服务打开，或先导出备份。</p>
  </header>

  <main id="list"></main>

  <footer>
    <p class="hint">记录存在这台设备的浏览器里，不上传。换设备或清缓存前记得导出。</p>
    <button class="plain" id="out">导出</button>
    <button class="plain" id="in">导入</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </footer>
</div>

<dialog id="dlg">
  <div class="dlg-head" id="dlg-head">添加景点</div>
  <form method="dialog" id="form">
    <div class="field">
      <label for="f-name">名称</label>
      <input type="text" id="f-name" required maxlength="48" placeholder="黄岩石窟" autocomplete="off">
    </div>
    <div class="field">
      <label for="f-country">国家</label>
      <input type="text" id="f-country" maxlength="24" placeholder="中国" list="countries" autocomplete="off">
      <datalist id="countries"></datalist>
    </div>
    <div class="field">
      <label id="pick-label">评级</label>
      <div class="picker" role="radiogroup" aria-labelledby="pick-label" id="picker"></div>
    </div>
    <div class="acts">
      <button type="button" class="plain kill" id="kill" hidden>删除</button>
      <button type="button" class="plain" id="cancel">取消</button>
      <button type="submit" class="go" id="save">保存</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  "use strict";

  /* 五档，从高到低。排名由字号和墨色表达，不配颜色。 */
  var TIERS = [
    { key:"hang", name:"夯",     blurb:"值得专程飞一趟", cls:"t1" },
    { key:"top",  name:"顶级",   blurb:"路过必须进去",   cls:"t2" },
    { key:"ren",  name:"人上人", blurb:"去了不亏",       cls:"t3" },
    { key:"npc",  name:"npc",    blurb:"有它没它一样",   cls:"t4" },
    { key:"la",   name:"拉完了", blurb:"劝退",           cls:"t5" }
  ];

  var SEED = [
    { id:"seed-huangyan", name:"黄岩石窟", country:"中国", tier:"top" }
  ];

  var KEY = "scenic-tiers-v1";
  var store = { ok:true };
  var spots = load();
  var editingId = null;
  var country = "";          /* 当前国家筛选，空 = 全部 */

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(Array.isArray(parsed)) return parsed.map(migrate);
      }
    }catch(e){
      store.ok = false;
      document.getElementById("warn").hidden = false;
    }
    return SEED.slice();
  }

  /* 老版本有 place/where（地点）、date/when（时间）、note/said（一句话），现已全部取消。
     读进来即丢弃；老记录没有国家，但凡有过地点的一律按中国处理，不对的改一下即可。 */
  function migrate(s){
    var hadPlace = !!(s.where || s.place);
    return {
      id: s.id || uid(),
      name: String(s.name || "未命名"),
      country: String(s.country || (hadPlace ? "中国" : "")),
      tier: isTier(s.tier) ? s.tier : "npc"
    };
  }

  function save(){
    if(!store.ok) return;
    try{
      localStorage.setItem(KEY, JSON.stringify(spots));
    }catch(e){
      store.ok = false;
      document.getElementById("warn").hidden = false;
    }
  }

  function isTier(k){
    for(var i=0;i<TIERS.length;i++) if(TIERS[i].key===k) return true;
    return false;
  }
  function uid(){
    return "s-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7);
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function countries(){
    var seen = {}, out = [];
    spots.forEach(function(s){
      var c = s.country || "未填";
      if(!seen[c]){ seen[c] = 0; out.push(c); }
      seen[c]++;
    });
    out.sort(function(a,b){ return seen[b] - seen[a] || a.localeCompare(b,"zh"); });
    return out.map(function(c){ return { name:c, n:seen[c] }; });
  }

  /* ---------- 渲染 ---------- */
  var list  = document.getElementById("list");
  var find  = document.getElementById("find");
  var chips = document.getElementById("chips");

  function visible(){
    var q = find.value.trim().toLowerCase();
    return spots.filter(function(s){
      if(country && (s.country || "未填") !== country) return false;
      if(!q) return true;
      return (s.name + " " + s.country).toLowerCase().indexOf(q) > -1;
    });
  }

  function render(){
    var shown = visible();
    var filtering = !!country || !!find.value.trim();

    list.innerHTML = TIERS.map(function(t){
      var mine = shown.filter(function(s){ return s.tier === t.key; });
      var rows = mine.length
        ? mine.map(function(s){
            return '<li><button type="button" class="row" data-open="' + s.id + '"' +
              ' aria-label="' + esc(s.name + "，" + t.name + "，打开详情") + '">' +
              '<span class="nm">' + esc(s.name) + '</span>' +
              '<span class="cy">' + esc(s.country || "—") + '</span>' +
            '</button></li>';
          }).join("")
        : '<li class="none">' + (filtering ? "没有匹配的" : "还没有") + '</li>';

      return '<section class="tier ' + t.cls + '">' +
        '<div class="tier-head">' +
          '<h2>' + esc(t.name) + '</h2>' +
          '<span class="n">' + mine.length + '</span>' +
          '<span class="blurb">' + esc(t.blurb) + '</span>' +
        '</div>' +
        '<ul class="rows">' + rows + '</ul>' +
      '</section>';
    }).join("");

    var cs = countries();
    chips.innerHTML = '<button class="chip" data-country="" aria-pressed="' + (!country) + '">全部' +
        '<span class="c">' + spots.length + '</span></button>' +
      cs.map(function(c){
        return '<button class="chip" data-country="' + esc(c.name) + '"' +
          ' aria-pressed="' + (country === c.name) + '">' + esc(c.name) +
          '<span class="c">' + c.n + '</span></button>';
      }).join("");

    document.getElementById("n-spots").textContent = spots.length;
    document.getElementById("n-countries").textContent =
      cs.filter(function(c){ return c.name !== "未填"; }).length;

    document.getElementById("countries").innerHTML =
      cs.filter(function(c){ return c.name !== "未填"; })
        .map(function(c){ return '<option value="' + esc(c.name) + '">'; }).join("");
  }

  /* ---------- 弹窗 ---------- */
  var dlg  = document.getElementById("dlg");
  var form = document.getElementById("form");
  // form.name 会被 HTMLFormElement 自身的 name 属性遮蔽，一律按 id 取
  var fName    = document.getElementById("f-name");
  var fCountry = document.getElementById("f-country");
  var killBtn  = document.getElementById("kill");

  document.getElementById("picker").innerHTML = TIERS.map(function(t,i){
    return '<span>' +
      '<input type="radio" name="tier" id="p-' + t.key + '" value="' + t.key + '"' + (i===1?" checked":"") + '>' +
      '<label for="p-' + t.key + '">' + esc(t.name) + '</label>' +
    '</span>';
  }).join("");

  function open(spot){
    editingId = spot ? spot.id : null;
    document.getElementById("dlg-head").textContent = spot ? spot.name : "添加景点";
    fName.value    = spot ? spot.name    : "";
    fCountry.value = spot ? spot.country : "";
    var r = form.querySelector('input[name=tier][value="' + (spot ? spot.tier : "top") + '"]');
    if(r) r.checked = true;
    killBtn.hidden = !spot;
    dlg.showModal();
    fName.focus();
  }

  form.addEventListener("submit", function(){
    var data = {
      name:    fName.value.trim(),
      country: fCountry.value.trim(),
      tier:    (form.querySelector("input[name=tier]:checked")||{}).value || "npc"
    };
    if(!data.name) return;

    if(editingId){
      spots = spots.map(function(s){
        return s.id === editingId ? Object.assign({}, s, data) : s;
      });
    }else{
      data.id = uid();
      spots.push(data);
    }
    editingId = null;
    dropStaleFilter();
    save();
    render();
  });

  /* 筛选中的国家可能因为这次编辑/删除而不存在了，顺手清掉，免得页面空白 */
  function dropStaleFilter(){
    if(country && !spots.some(function(s){ return (s.country||"未填") === country; })) country = "";
  }

  killBtn.addEventListener("click", function(){
    var gone = spots.filter(function(s){ return s.id === editingId; })[0];
    if(!gone || !confirm("删除「" + gone.name + "」？")) return;
    spots = spots.filter(function(s){ return s.id !== editingId; });
    editingId = null;
    dropStaleFilter();
    save();
    render();
    dlg.close();
  });

  document.getElementById("cancel").addEventListener("click", function(){
    editingId = null;
    dlg.close();
  });
  document.getElementById("add").addEventListener("click", function(){ open(null); });

  list.addEventListener("click", function(e){
    var row = e.target.closest("[data-open]");
    if(!row) return;
    var hit = spots.filter(function(s){ return s.id === row.getAttribute("data-open"); })[0];
    if(hit) open(hit);
  });

  chips.addEventListener("click", function(e){
    var chip = e.target.closest("[data-country]");
    if(!chip) return;
    country = chip.getAttribute("data-country");
    render();
  });

  find.addEventListener("input", render);

  /* ---------- 导入导出 ---------- */
  document.getElementById("out").addEventListener("click", function(){
    var blob = new Blob([JSON.stringify(spots, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "去过的地方.json"; a.click();
    URL.revokeObjectURL(url);
  });

  var file = document.getElementById("file");
  document.getElementById("in").addEventListener("click", function(){ file.click(); });
  file.addEventListener("change", function(){
    var f = file.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(!Array.isArray(data)) throw new Error("这个文件不是备份");
        spots = data.map(migrate);
        country = "";
        save();
        render();
      }catch(err){
        alert("读不进来：" + err.message);
      }
      file.value = "";
    };
    reader.readAsText(f);
  });

  render();
})();
</script>
</body>
</html>
