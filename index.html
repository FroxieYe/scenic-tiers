<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>去过的地方</title>
<meta name="description" content="我去过的景点，五档分级：夯、顶级、人上人、npc、拉完了。">
<meta name="theme-color" content="#121212">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  :root{
    color-scheme:dark;

    /* 取自模板封面的实际像素：条目区 #1A1A1A，行缝纯黑，胶囊纯白 */
    --bg:#121212;
    --grid:#000000;
    --lane:#1A1A1A;
    --tile:#262626;
    --tile-h:#343434;

    --ink:#F2F2F2;
    --ink-2:#A8A8A8;
    --ink-3:#6E6E6E;
    --line:#2E2E2E;

    /* TierMaker 标准档位色，配黑字，六档对比度都在 5:1 以上 */
    --t1:#FF7F7F;
    --t2:#FFBF7F;
    --t3:#FFFF7F;
    --t4:#7FFF7F;
    --t5:#7FFFFF;
    --t6:#7F7FFF;

    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
           "Microsoft YaHei",system-ui,"Segoe UI",sans-serif;
  }

  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  }
  .page{max-width:1080px;margin:0 auto;padding:clamp(28px,5vw,56px) clamp(14px,3vw,24px) 100px}
  button,input{font:inherit}
  :focus-visible{outline:2px solid #FFF;outline-offset:2px}

  /* ---------- 页头 ---------- */
  .top{margin-bottom:22px}
  h1{margin:0;font-size:clamp(26px,4.4vw,36px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
  .counts{margin:9px 0 0;font-size:13.5px;color:var(--ink-2)}
  .counts b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

  .wall{display:flex;flex-wrap:wrap;gap:13px;margin-top:18px}
  .pin{position:relative;cursor:pointer;background:none;border:0;padding:0;
       width:38px;height:38px;border-radius:50%;transition:transform .14s,opacity .14s}
  .pin .flag{width:38px;height:38px;border-radius:50%;display:block;background:var(--tile)}
  .pin .num{position:absolute;right:-4px;bottom:-4px;min-width:17px;height:17px;padding:0 4px;
            border-radius:9px;background:var(--bg);color:var(--ink-2);border:1px solid var(--line);
            font-size:10px;font-weight:700;line-height:15px;font-variant-numeric:tabular-nums}
  .pin:hover{transform:translateY(-2px)}
  .wall[data-filtering="1"] .pin{opacity:.3}
  .wall[data-filtering="1"] .pin[aria-pressed="true"]{opacity:1}
  .pin[aria-pressed="true"] .flag{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #FFF}
  .pin.all{display:grid;place-items:center;background:var(--tile);color:var(--ink-2);
           font-size:11px;font-weight:700;letter-spacing:-.02em}
  .pin.all[aria-pressed="true"]{background:#FFF;color:#000}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .bar{display:flex;gap:8px;align-items:center;margin-top:20px}
  input[type=search],input[type=text]{
    color:var(--ink);background:var(--tile);border:1px solid transparent;border-radius:999px;
    padding:10px 16px;font-size:14px;transition:border-color .12s;
  }
  input[type=search]{flex:1;min-width:0;max-width:300px}
  input:hover{border-color:var(--line)}
  input:focus{outline:0;border-color:#FFF}
  ::placeholder{color:var(--ink-3)}

  /* 封面右下那个白色圆角胶囊，拿来做主按钮 */
  .btn{cursor:pointer;border-radius:999px;font-size:14px;font-weight:700;padding:10px 22px;
       border:0;white-space:nowrap;transition:opacity .12s,background .12s}
  .btn.primary{background:#FFF;color:#000}
  .btn.primary:hover{opacity:.84}
  .btn.ghost{background:var(--tile);color:var(--ink-2);font-weight:600}
  .btn.ghost:hover{background:var(--tile-h);color:var(--ink)}

  /* ---------- 榜单本体 ---------- */
  .board{background:var(--grid);border:4px solid var(--grid);border-radius:6px;
         display:grid;gap:4px;overflow:hidden}
  .tier{display:grid;grid-template-columns:132px 1fr;gap:4px}
  .label{
    background:var(--c);color:#000;display:grid;place-content:center;align-content:center;
    text-align:center;padding:14px 8px;min-height:106px;
  }
  .label .nm{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
  .label .n{font-size:12px;font-weight:700;opacity:.52;margin-top:5px;font-variant-numeric:tabular-nums}
  .label .blurb{font-size:10.5px;font-weight:600;opacity:.46;margin-top:2px;line-height:1.3}

  .lane{background:var(--lane);display:flex;flex-wrap:wrap;gap:6px;padding:7px;
        align-content:flex-start;min-height:106px}
  .tile{
    width:100px;height:100px;background:var(--tile);border:0;border-radius:4px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    padding:6px 5px;transition:background .12s;
  }
  .tile:hover{background:var(--tile-h)}
  /* manipulation 而不是 none：手指按在方块上仍能滚页面，
     真正进入拖拽后再由 JS 的 preventDefault 挡住滚动 */
  .tile{touch-action:manipulation}
  .tile.lifting{opacity:.22}

  .drag-ghost{
    position:fixed;z-index:60;pointer-events:none;margin:0;
    transform:translate(-50%,-50%) scale(1.08) rotate(-3deg);
    box-shadow:0 14px 32px rgba(0,0,0,.65);opacity:.96;
  }
  .lane.over{background:#232323}
  .lane.over::after{
    content:"";position:absolute;inset:3px;border-radius:3px;
    border:2px dashed var(--c);opacity:.75;pointer-events:none;
  }
  .lane{position:relative}
  body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
  body.dragging .tile{cursor:grabbing}
  .tile .flag{width:26px;height:26px;border-radius:50%;flex:none;background:var(--tile-h)}
  .tile .nm{
    font-size:11px;line-height:1.25;color:var(--ink);text-align:center;font-weight:500;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
    overflow-wrap:break-word;width:100%;
  }
  .tile .ct{
    font-size:10px;line-height:1.2;color:var(--ink-3);text-align:center;width:100%;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .ph{display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink-3)}
  .empty{align-self:center;font-size:12px;color:#454545;padding-left:6px}

  /* ---------- 页脚 ---------- */
  footer{margin-top:30px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  footer .hint{font-size:12px;color:var(--ink-3);margin-right:auto;max-width:52ch;line-height:1.55}
  .warn{font-size:12.5px;color:var(--t1);margin:14px 0 0}

  /* 本地改动没发布时的提示条。没有它，浏览器里的旧草稿会悄悄挡住线上清单。 */
  .draft[hidden]{display:none}
  .draft{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
         margin-top:16px;padding:10px 14px;border-radius:10px;
         background:rgba(255,191,127,.12);border:1px solid rgba(255,191,127,.3)}
  .draft .msg{font-size:12.5px;color:#FFD9AE;margin-right:auto;line-height:1.5}
  .draft button{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;
                border:0;cursor:pointer;background:rgba(255,255,255,.14);color:var(--ink)}
  .draft button:hover{background:rgba(255,255,255,.24)}
  .draft button.drop{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.26)}

  /* ---------- 弹窗 ---------- */
  dialog{border:1px solid var(--line);border-radius:12px;background:#1E1E1E;color:var(--ink);
         padding:0;width:min(420px,92vw);box-shadow:0 30px 60px -20px rgba(0,0,0,.9)}
  dialog::backdrop{background:rgba(0,0,0,.66)}
  .dlg-head{display:flex;align-items:center;gap:10px;padding:18px 20px 0}
  .dlg-head .flag{width:26px;height:26px;border-radius:50%}
  .dlg-head .t{font-size:16px;font-weight:700;letter-spacing:-.01em}
  form{padding:16px 20px 18px;display:grid;gap:13px}
  .field{display:grid;gap:6px}
  .field label{font-size:12px;color:var(--ink-2);font-weight:600}
  .field input{width:100%;border-radius:8px;background:#141414;border:1px solid var(--line)}

  .picker{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
  .picker span{position:relative;display:block}
  .picker input{position:absolute;opacity:0;width:0;height:0}
  .picker label{
    display:block;text-align:center;font-size:11.5px;line-height:1.3;cursor:pointer;padding:9px 1px;
    border-radius:7px;color:#000;background:var(--c);opacity:.34;font-weight:700;
    user-select:none;transition:opacity .12s;
  }
  .picker label:hover{opacity:.6}
  .picker input:checked + label{opacity:1}
  .picker input:focus-visible + label{outline:2px solid #FFF;outline-offset:2px}

  .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:3px}
  .acts .kill{margin-right:auto;background:transparent;color:#FF8A7A}
  .acts .kill:hover{background:rgba(255,138,122,.14);color:#FF8A7A}

  @media (max-width:760px){
    .tier{grid-template-columns:86px 1fr}
    .label{padding:10px 5px;min-height:96px}
    .label .nm{font-size:19px}
    .label .blurb{display:none}
    .lane{min-height:96px;gap:5px;padding:5px}
    .tile{width:88px;height:100px}
    .picker{grid-template-columns:repeat(3,1fr)}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <h1>去过的地方</h1>
    <p class="counts"><b id="n-spots">0</b> 处 · <b id="n-countries">0</b> 个国家</p>
    <div class="wall" id="wall" role="group" aria-label="按国家筛选"></div>
    <div class="bar">
      <input type="search" id="find" placeholder="搜景点、城市或国家" aria-label="搜索">
      <button class="btn primary" id="add">添加</button>
    </div>
    <div class="draft" id="draft" hidden>
      <span class="msg" id="draft-msg"></span>
      <button id="draft-out">导出</button>
      <button class="drop" id="draft-drop">丢弃草稿</button>
    </div>
    <p class="warn" id="warn" hidden>这个浏览器不让本地文件存数据，改动不会留下。用本地服务打开，或先导出备份。</p>
  </header>

  <main class="board" id="board"></main>

  <footer>
    <p class="hint">方块可以直接拖到别的档位（手机上长按再拖）。记录存在这台设备的浏览器里，不上传；换设备或清缓存前记得导出。</p>
    <button class="btn ghost" id="out">导出</button>
    <button class="btn ghost" id="in">导入</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </footer>
</div>

<dialog id="dlg">
  <div class="dlg-head">
    <img class="flag" id="dlg-flag" alt="" width="26" height="26">
    <span class="t" id="dlg-title">添加景点</span>
  </div>
  <form method="dialog" id="form">
    <div class="field">
      <label for="f-name">名称</label>
      <input type="text" id="f-name" required maxlength="48" placeholder="黄岩石窟" autocomplete="off">
    </div>
    <div class="field">
      <label for="f-city">城市</label>
      <input type="text" id="f-city" maxlength="24" placeholder="台州" autocomplete="off">
    </div>
    <div class="field">
      <label for="f-country">国家</label>
      <input type="text" id="f-country" maxlength="24" placeholder="中国" list="countries" autocomplete="off">
      <datalist id="countries"></datalist>
    </div>
    <div class="field">
      <label id="pick-label">评级</label>
      <div class="picker" role="radiogroup" aria-labelledby="pick-label" id="picker"></div>
    </div>
    <div class="acts">
      <button type="button" class="btn ghost kill" id="kill" hidden>删除</button>
      <button type="button" class="btn ghost" id="cancel">取消</button>
      <button type="submit" class="btn primary" id="save">保存</button>
    </div>
  </form>
</dialog>

<script src="spots.js"></script>
<script>
(function(){
  "use strict";

  /* 五档。颜色沿用 TierMaker 标准色，标签一律黑字。 */
  var TIERS = [
    { key:"shen", name:"神级",   blurb:"此生必去一次",   c:"var(--t1)" },
    { key:"hang", name:"夯",     blurb:"值得专程飞一趟", c:"var(--t2)" },
    { key:"top",  name:"顶级",   blurb:"路过必须进去",   c:"var(--t3)" },
    { key:"ren",  name:"人上人", blurb:"去了不亏",       c:"var(--t4)" },
    { key:"npc",  name:"npc",    blurb:"有它没它一样",   c:"var(--t5)" },
    { key:"la",   name:"拉完了", blurb:"劝退",           c:"var(--t6)" }
  ];

  /* 国家名 → ISO 两位码，用来取圆形国旗。认不出来的退回首字占位圆。 */
  var ISO = {
    "中国":"cn","中国大陆":"cn","香港":"hk","中国香港":"hk","澳门":"mo","中国澳门":"mo",
    "台湾":"tw","中国台湾":"tw","日本":"jp","韩国":"kr","南韩":"kr","朝鲜":"kp",
    "蒙古":"mn","泰国":"th","越南":"vn","柬埔寨":"kh","老挝":"la","缅甸":"mm",
    "马来西亚":"my","新加坡":"sg","印度尼西亚":"id","印尼":"id","菲律宾":"ph","文莱":"bn",
    "印度":"in","尼泊尔":"np","不丹":"bt","斯里兰卡":"lk","马尔代夫":"mv","巴基斯坦":"pk",
    "孟加拉国":"bd","哈萨克斯坦":"kz","乌兹别克斯坦":"uz","吉尔吉斯斯坦":"kg",
    "阿联酋":"ae","阿拉伯联合酋长国":"ae","沙特阿拉伯":"sa","卡塔尔":"qa","阿曼":"om",
    "以色列":"il","约旦":"jo","土耳其":"tr","伊朗":"ir","格鲁吉亚":"ge","亚美尼亚":"am",
    "阿塞拜疆":"az","俄罗斯":"ru","乌克兰":"ua",
    "英国":"gb","爱尔兰":"ie","法国":"fr","德国":"de","意大利":"it","西班牙":"es",
    "葡萄牙":"pt","荷兰":"nl","比利时":"be","卢森堡":"lu","瑞士":"ch","奥地利":"at",
    "捷克":"cz","斯洛伐克":"sk","波兰":"pl","匈牙利":"hu","罗马尼亚":"ro","保加利亚":"bg",
    "希腊":"gr","克罗地亚":"hr","斯洛文尼亚":"si","塞尔维亚":"rs","黑山":"me","阿尔巴尼亚":"al",
    "瑞典":"se","挪威":"no","芬兰":"fi","丹麦":"dk","冰岛":"is","爱沙尼亚":"ee",
    "拉脱维亚":"lv","立陶宛":"lt","马耳他":"mt","塞浦路斯":"cy","摩纳哥":"mc","梵蒂冈":"va",
    "美国":"us","加拿大":"ca","墨西哥":"mx","古巴":"cu","巴哈马":"bs","牙买加":"jm",
    "哥斯达黎加":"cr","巴拿马":"pa","巴西":"br","阿根廷":"ar","智利":"cl","秘鲁":"pe",
    "哥伦比亚":"co","厄瓜多尔":"ec","玻利维亚":"bo","乌拉圭":"uy",
    "埃及":"eg","摩洛哥":"ma","突尼斯":"tn","南非":"za","肯尼亚":"ke","坦桑尼亚":"tz",
    "埃塞俄比亚":"et","纳米比亚":"na","博茨瓦纳":"bw","毛里求斯":"mu","塞舌尔":"sc",
    "澳大利亚":"au","澳洲":"au","新西兰":"nz","斐济":"fj","巴布亚新几内亚":"pg"
  };
  var FLAG_BASE = "https://cdn.jsdelivr.net/gh/HatScripts/circle-flags@gh-pages/flags/";

  var KEY = "scenic-tiers-v1";
  var store = { ok:true };
  var seq = 0;

  /* 已发布清单来自 spots.js，是这个网址上所有人看到的版本 */
  var PUBLISHED = (window.SPOTS || []).map(migrate);

  /* 草稿基于哪个已发布版本；null 表示当前没有草稿，看到的就是已发布的 */
  var draftBase = null;

  var spots = load();
  var editingId = null;
  var pick = "";

  function hashOf(list){
    var str = JSON.stringify(list.map(function(x){ return [x.name, x.city, x.country, x.tier]; }));
    var h = 5381;
    for(var i=0;i<str.length;i++){ h = ((h<<5) + h + str.charCodeAt(i)) | 0; }
    return String(h);
  }

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var p = JSON.parse(raw);
        if(Array.isArray(p)){                       // 旧版本存的是裸数组
          draftBase = "";
          return p.map(migrate);
        }
        if(p && Array.isArray(p.spots)){
          draftBase = String(p.base == null ? "" : p.base);
          return p.spots.map(migrate);
        }
      }
    }catch(e){
      store.ok = false;
      document.getElementById("warn").hidden = false;
    }
    return PUBLISHED.slice();
  }

  /* 老版本有 place/where（地点）、date/when（时间）、note/said（一句话），已全部取消，读进来即丢弃。
     老记录没有国家，但凡有过地点的一律按中国处理，不对的点开改一下。 */
  function migrate(s){
    var legacy = String(s.where || s.place || "").trim();   /* 老字段形如「浙江 台州」 */
    var parts = legacy ? legacy.split(/[\s　]+/) : [];
    return {
      id: s.id || ("p" + (++seq) + "-" + Math.random().toString(36).slice(2,6)),
      name: String(s.name || "未命名"),
      city: String(s.city || (parts.length ? parts[parts.length - 1] : "")),
      country: String(s.country || (legacy ? "中国" : "")),
      tier: isTier(s.tier) ? s.tier : "npc"
    };
  }

  function save(){
    if(!store.ok) return;
    draftBase = hashOf(PUBLISHED);
    try{
      localStorage.setItem(KEY, JSON.stringify({ base: draftBase, spots: bare(spots) }));
    }catch(e){
      store.ok = false;
      document.getElementById("warn").hidden = false;
    }
  }

  function bare(list){
    return list.map(function(s){
      return { name:s.name, city:s.city, country:s.country, tier:s.tier };
    });
  }

  /* 导出的就是可以直接提交进仓库的 spots.js */
  function spotsJs(list){
    return "/* 景点清单。改这个文件就能更新网站，不用碰 index.html。\n" +
           "   tier 取 shen / hang / top / ren / npc / la\n" +
           "   （神级 / 夯 / 顶级 / 人上人 / npc / 拉完了） */\n" +
           "window.SPOTS = [\n" +
           list.map(function(s){
             return '  { "name": ' + JSON.stringify(s.name) +
                    ', "city": ' + JSON.stringify(s.city) +
                    ', "country": ' + JSON.stringify(s.country) +
                    ', "tier": ' + JSON.stringify(s.tier) + ' }';
           }).join(",\n") + "\n];\n";
  }

  function isTier(k){
    for(var i=0;i<TIERS.length;i++) if(TIERS[i].key===k) return true;
    return false;
  }
  function uid(){
    return "s-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7);
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function iso(name){
    var k = String(name||"").trim();
    return ISO[k] || ISO[k.replace(/[　\s]/g,"")] || "";
  }

  /* 认得出国家就上圆形国旗，认不出就用首字占位圆，两者同尺寸同位置 */
  function flagHtml(cn, cls, px){
    var code = iso(cn), label = cn || "未填";
    if(code){
      return '<img class="' + cls + '" src="' + FLAG_BASE + code + '.svg"' +
             ' alt="" width="' + px + '" height="' + px + '" loading="lazy" decoding="async"' +
             ' onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),' +
             '{className:\'' + cls + ' ph\',textContent:' + JSON.stringify(label.slice(0,1)) + '}))">';
    }
    return '<span class="' + cls + ' ph">' + esc(label.slice(0,1)) + '</span>';
  }

  function countries(){
    var seen = {}, out = [];
    spots.forEach(function(s){
      var c = s.country || "未填";
      if(!seen[c]){ seen[c] = 0; out.push(c); }
      seen[c]++;
    });
    out.sort(function(a,b){ return seen[b]-seen[a] || a.localeCompare(b,"zh"); });
    return out.map(function(c){ return { name:c, n:seen[c] }; });
  }

  /* ---------- 渲染 ---------- */
  var board = document.getElementById("board");
  var find  = document.getElementById("find");
  var wall  = document.getElementById("wall");

  function visible(){
    var q = find.value.trim().toLowerCase();
    return spots.filter(function(s){
      if(pick && (s.country || "未填") !== pick) return false;
      if(!q) return true;
      return (s.name + " " + s.city + " " + s.country).toLowerCase().indexOf(q) > -1;
    });
  }

  function render(){
    var shown = visible();
    var filtering = !!pick || !!find.value.trim();

    board.innerHTML = TIERS.map(function(t){
      var mine = shown.filter(function(s){ return s.tier === t.key; });
      var tiles = mine.length
        ? mine.map(function(s){
            return '<button type="button" class="tile" data-open="' + s.id + '"' +
              ' title="' + esc([s.name, s.city, s.country].filter(Boolean).join("　")) + '"' +
              ' aria-label="' + esc(s.name + "，" +
                  [s.city, s.country].filter(Boolean).join(" ") + "，" + t.name + "，打开详情") + '">' +
              flagHtml(s.country, "flag", 28) +
              '<span class="nm">' + esc(s.name) + '</span>' +
              '<span class="ct">' + esc(s.city || "—") + '</span>' +
            '</button>';
          }).join("")
        : '<p class="empty">' + (filtering ? "没有匹配的" : "还没有") + '</p>';

      return '<section class="tier" style="--c:' + t.c + '">' +
        '<div class="label">' +
          '<div class="nm">' + esc(t.name) + '</div>' +
          '<div class="n">' + mine.length + '</div>' +
          '<div class="blurb">' + esc(t.blurb) + '</div>' +
        '</div>' +
        '<div class="lane">' + tiles + '</div>' +
      '</section>';
    }).join("");

    var cs = countries();
    wall.setAttribute("data-filtering", pick ? "1" : "0");
    wall.innerHTML =
      '<button class="pin all" data-country="" aria-pressed="' + (!pick) + '" title="全部">全部' +
        '<span class="sr">，共 ' + spots.length + ' 处</span></button>' +
      cs.map(function(c){
        return '<button class="pin" data-country="' + esc(c.name) + '"' +
          ' aria-pressed="' + (pick === c.name) + '" title="' + esc(c.name) + '">' +
          flagHtml(c.name, "flag", 38) +
          '<span class="num">' + c.n + '</span>' +
          '<span class="sr">' + esc(c.name) + '，' + c.n + ' 处</span>' +
        '</button>';
      }).join("");

    document.getElementById("n-spots").textContent = spots.length;
    document.getElementById("n-countries").textContent =
      cs.filter(function(c){ return c.name !== "未填"; }).length;

    document.getElementById("countries").innerHTML =
      Object.keys(ISO).map(function(c){ return '<option value="' + esc(c) + '">'; }).join("");

    paintDraft();
  }

  var draftBar = document.getElementById("draft");
  function paintDraft(){
    var on = draftBase !== null;
    draftBar.hidden = !on;
    if(!on) return;
    var stale = draftBase !== hashOf(PUBLISHED);
    document.getElementById("draft-msg").textContent = stale
      ? "本地草稿 " + spots.length + " 处，还没发布；而且已发布的清单有更新——丢弃草稿就能看到最新版"
      : "本地草稿 " + spots.length + " 处，还没发布。导出后提交 spots.js 才会出现在网址上。";
  }

  document.getElementById("draft-drop").addEventListener("click", function(){
    if(!confirm("丢弃本地草稿，回到已发布的清单？")) return;
    try{ localStorage.removeItem(KEY); }catch(e){}
    draftBase = null;
    spots = PUBLISHED.slice();
    pick = "";
    render();
  });

  /* ---------- 弹窗 ---------- */
  var dlg  = document.getElementById("dlg");
  var form = document.getElementById("form");
  // form.name 会被 HTMLFormElement 自身的 name 属性遮蔽，一律按 id 取
  var fName    = document.getElementById("f-name");
  var fCity    = document.getElementById("f-city");
  var fCountry = document.getElementById("f-country");
  var killBtn  = document.getElementById("kill");
  var dlgFlag  = document.getElementById("dlg-flag");

  document.getElementById("picker").innerHTML = TIERS.map(function(t){
    return '<span style="--c:' + t.c + '">' +
      '<input type="radio" name="tier" id="p-' + t.key + '" value="' + t.key + '"' +
        (t.key==="top" ? " checked" : "") + '>' +
      '<label for="p-' + t.key + '">' + esc(t.name) + '</label>' +
    '</span>';
  }).join("");

  function syncDlgFlag(){
    var code = iso(fCountry.value);
    dlgFlag.style.display = code ? "block" : "none";
    if(code) dlgFlag.src = FLAG_BASE + code + ".svg";
  }
  fCountry.addEventListener("input", syncDlgFlag);

  function open(spot){
    editingId = spot ? spot.id : null;
    document.getElementById("dlg-title").textContent = spot ? spot.name : "添加景点";
    fName.value    = spot ? spot.name    : "";
    fCity.value    = spot ? spot.city    : "";
    fCountry.value = spot ? spot.country : "";
    var r = form.querySelector('input[name=tier][value="' + (spot ? spot.tier : "top") + '"]');
    if(r) r.checked = true;
    killBtn.hidden = !spot;
    syncDlgFlag();
    dlg.showModal();
    fName.focus();
  }

  form.addEventListener("submit", function(){
    var data = {
      name:    fName.value.trim(),
      city:    fCity.value.trim(),
      country: fCountry.value.trim(),
      tier:    (form.querySelector("input[name=tier]:checked")||{}).value || "npc"
    };
    if(!data.name) return;
    if(editingId){
      spots = spots.map(function(s){
        return s.id === editingId ? Object.assign({}, s, data) : s;
      });
    }else{
      data.id = uid();
      spots.push(data);
    }
    editingId = null;
    dropStaleFilter();
    save();
    render();
  });

  /* 筛选中的国家可能因为这次编辑/删除而不存在了，顺手清掉，免得页面空白 */
  function dropStaleFilter(){
    if(pick && !spots.some(function(s){ return (s.country||"未填") === pick; })) pick = "";
  }

  killBtn.addEventListener("click", function(){
    var gone = spots.filter(function(s){ return s.id === editingId; })[0];
    if(!gone || !confirm("删除「" + gone.name + "」？")) return;
    spots = spots.filter(function(s){ return s.id !== editingId; });
    editingId = null;
    dropStaleFilter();
    save();
    render();
    dlg.close();
  });

  document.getElementById("cancel").addEventListener("click", function(){
    editingId = null;
    dlg.close();
  });
  document.getElementById("add").addEventListener("click", function(){ open(null); });

  var suppressClick = false;
  board.addEventListener("click", function(e){
    if(suppressClick){ suppressClick = false; return; }   /* 刚拖过，别顺手开弹窗 */
    var tile = e.target.closest("[data-open]");
    if(!tile) return;
    var hit = spots.filter(function(s){ return s.id === tile.getAttribute("data-open"); })[0];
    if(hit) open(hit);
  });

  /* ---------- 拖拽换档 ---------- */
  var MOVE_SLOP = 6;        /* 超过这个位移才算拖，否则当点击 */
  var HOLD_MS   = 280;      /* 触屏需要长按这么久才进入拖拽，之前仍可滚页面 */
  var drag = null;

  function stopScroll(e){ if(drag && drag.live) e.preventDefault(); }

  board.addEventListener("pointerdown", function(e){
    if(e.button) return;                                  /* 只认主键 */
    var tile = e.target.closest("[data-open]");
    if(!tile) return;
    drag = {
      id: tile.getAttribute("data-open"), tile: tile,
      x0: e.clientX, y0: e.clientY, live: false,
      touch: e.pointerType !== "mouse", timer: 0, lane: null
    };
    if(drag.touch){
      drag.timer = setTimeout(function(){
        if(drag && !drag.live) lift(drag.x0, drag.y0);
      }, HOLD_MS);
    }
  });

  function lift(x, y){
    drag.live = true;
    drag.x = x; drag.y = y; drag.dy = 0;
    requestAnimationFrame(autoScroll);
    var r = drag.tile.getBoundingClientRect();
    var g = drag.tile.cloneNode(true);
    g.className = "tile drag-ghost";
    g.style.width = r.width + "px";
    g.style.height = r.height + "px";
    drag.ghost = g;
    document.body.appendChild(g);
    drag.tile.classList.add("lifting");
    document.body.classList.add("dragging");
    document.addEventListener("touchmove", stopScroll, { passive:false });
    place(x, y);
  }

  /* 指针贴近视口上下边缘时自动滚动，否则够不着屏幕外的档位 */
  function autoScroll(){
    if(!drag || !drag.live) return;
    if(drag.dy){
      var before = window.scrollY;
      window.scrollBy(0, drag.dy);
      if(window.scrollY !== before) place(drag.x, drag.y);
    }
    requestAnimationFrame(autoScroll);
  }

  function edge(y){
    var EDGE = 90, STEP = 16;
    if(y < EDGE)                   return -STEP * (1 - y / EDGE);
    if(y > innerHeight - EDGE)     return  STEP * (1 - (innerHeight - y) / EDGE);
    return 0;
  }

  function place(x, y){
    drag.x = x; drag.y = y; drag.dy = edge(y);
    drag.ghost.style.left = x + "px";
    drag.ghost.style.top  = y + "px";
    drag.ghost.style.display = "none";
    var el = document.elementFromPoint(x, y);
    drag.ghost.style.display = "";
    var lane = el && el.closest ? el.closest(".lane") : null;
    if(lane !== drag.lane){
      if(drag.lane) drag.lane.classList.remove("over");
      if(lane) lane.classList.add("over");
      drag.lane = lane;
    }
    drag.beforeId = lane ? anchorIn(lane, x, y) : null;
  }

  /* 指针已经越过这块方块了吗（按阅读顺序：先比行，再比左右） */
  function past(r, x, y){
    if(y > r.bottom) return true;
    if(y < r.top)    return false;
    return x > r.left + r.width / 2;
  }

  /* 应插到哪个方块之前；null = 放到该档末尾 */
  function anchorIn(lane, x, y){
    var tiles = lane.querySelectorAll(".tile");
    for(var i=0;i<tiles.length;i++){
      var id = tiles[i].getAttribute("data-open");
      if(id === drag.id) continue;
      if(!past(tiles[i].getBoundingClientRect(), x, y)) return id;
    }
    return null;
  }

  document.addEventListener("pointermove", function(e){
    if(!drag) return;
    if(drag.live){ place(e.clientX, e.clientY); return; }
    var far = Math.abs(e.clientX - drag.x0) > MOVE_SLOP ||
              Math.abs(e.clientY - drag.y0) > MOVE_SLOP;
    if(!far) return;
    if(drag.touch){ clearTimeout(drag.timer); drag = null; return; }  /* 触屏上这是滚动 */
    lift(e.clientX, e.clientY);
  });

  function endDrag(commit){
    if(!drag) return;
    clearTimeout(drag.timer);
    if(drag.live){
      document.removeEventListener("touchmove", stopScroll, { passive:false });
      if(drag.ghost && drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
      drag.tile.classList.remove("lifting");
      document.body.classList.remove("dragging");
      if(drag.lane) drag.lane.classList.remove("over");
      suppressClick = true;
      var tierKey = commit && drag.lane ? laneTier(drag.lane) : null;
      var d = drag; drag = null;
      if(tierKey){
        reseat(d.id, tierKey, d.beforeId);
        save();
        render();
        return;
      }
    }
    drag = null;
  }

  function laneTier(lane){
    var tiers = [].slice.call(document.querySelectorAll(".tier"));
    var i = tiers.indexOf(lane.closest(".tier"));
    return i < 0 ? null : TIERS[i].key;
  }

  /* 把某条移到目标档，并插到 beforeId 之前；beforeId 为空则排在该档最后 */
  function reseat(id, tierKey, beforeId){
    var idx = -1, i;
    for(i=0;i<spots.length;i++) if(spots[i].id === id){ idx = i; break; }
    if(idx < 0) return;
    var item = spots[idx];
    spots.splice(idx, 1);
    item.tier = tierKey;

    var at = -1;
    if(beforeId){
      for(i=0;i<spots.length;i++) if(spots[i].id === beforeId){ at = i; break; }
    }
    if(at < 0){
      var last = -1;
      for(i=0;i<spots.length;i++) if(spots[i].tier === tierKey) last = i;
      at = last < 0 ? spots.length : last + 1;
    }
    spots.splice(at, 0, item);
  }

  document.addEventListener("pointerup",     function(){ endDrag(true);  });
  document.addEventListener("pointercancel", function(){ endDrag(false); });
  window.addEventListener("blur",            function(){ endDrag(false); });

  wall.addEventListener("click", function(e){
    var p = e.target.closest("[data-country]");
    if(!p) return;
    var c = p.getAttribute("data-country");
    pick = (c && c === pick) ? "" : c;     /* 再点一次取消筛选 */
    render();
  });

  find.addEventListener("input", render);

  /* ---------- 导入导出 ---------- */
  function exportSpots(){
    var blob = new Blob([spotsJs(spots)], {type:"text/javascript;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "spots.js"; a.click();
    URL.revokeObjectURL(url);
  }
  document.getElementById("out").addEventListener("click", exportSpots);
  document.getElementById("draft-out").addEventListener("click", exportSpots);

  var file = document.getElementById("file");
  file.setAttribute("accept", ".js,.json,application/json,text/javascript");
  document.getElementById("in").addEventListener("click", function(){ file.click(); });
  file.addEventListener("change", function(){
    var f = file.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var txt = String(reader.result);
        var i = txt.indexOf("["), j = txt.lastIndexOf("]");   /* spots.js 和裸 JSON 都吃 */
        if(i < 0 || j < i) throw new Error("这个文件里没有清单");
        var data = JSON.parse(txt.slice(i, j + 1));
        if(!Array.isArray(data)) throw new Error("这个文件不是备份");
        spots = data.map(migrate);
        pick = "";
        save();
        render();
      }catch(err){ alert("读不进来：" + err.message); }
      file.value = "";
    };
    reader.readAsText(f);
  });

  render();
})();
</script>
</body>
</html>
